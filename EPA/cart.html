<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1IKE - Página Inicial</title>
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/cart.css">
</head>
<body>
    <header> <!--Cabeçalho da página-->
        <a href="index.html"><img src="./img/like_logo.png" alt="L1ke-Logo" class="logo"></a> <!--Logo-->
        <div class="SearchBox"> <!--Barra de pesquisas-->
            <form>
                <input type="submit" value=" " class="SearchBoxButton">
                <input type="text" placeholder="Pesquise Aqui..." class="SearchBoxText">
            </form>
        </div>
        <button type="button" id="userBox" onclick="loginPage()"> <!--Botão do usuário/login-->
            Faça seu login
        </button>
    </header>
    <section>
        <div class="cartProdArea">
            <div class="cartArea">
                <h1>Meu Carrinho</h1>
                <div class="cartProd">
                    <img src="./img/menprod/shoe01.jpg" alt="" class="cartProdImg">
                    <div class="cartText">
                    <h2>Tênis Casual Masculino</h2>
                    <p>Cor:Preto</p>
                    <p>Tamanho:41</p>
                    </div>
                </div>
                <hr class="line">
                <div class="cartQuant">
                <h1><span class="oldPrice">R$210,99</span> $159,51</h1>
                </div>            
            </div>
            <div class="checkinArea">
                <h1>Resumo da Compra</h1>
                <h3>Subtotal: <span class="price"> R$159,51</span></h3>
                <hr>
                <h3>Cupom de desconto: <span class="discount"><a href="">Adicionar</a></span></h3>
                <hr>
                <h3>Valor Total : <span class="price"> R$159,51</span><br>
                <div class="checkinAreaButtons">
                    <button>Finalizar</button><br>
                    <button onclick="indexPageLink()">Escolher Mais Produtos</button>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div id="footerContent">
            <div><h3>Sobre nós</h3>
                <a href="malito:likecalcadosepa@gmail.com"><h4>Email</h4></a>
                <h4><a href="http://www.banner.like2023.great-site.net/?i=1">Banner da empresa</a></h4>
                <h4><a href="https://forms.gle/wGvHWy6Ep5JN6v737">Trabalhe Conosco</a></h4>
            </div>
            <div id="midia">
                <h3>Nossas Redes Sociais</h3>
                <a href="https://www.instagram.com/like_calcados_epa/"><button id="instagramlink"> </button></a>
                <a href="https://www.facebook.com"><button id="facebookLink"></button></a>
                <a href="https://www.twitter.com"><button id="twitterLink"></button></a>
                
            </div>
            
            <figure>
                <figcaption><h3>Formas de pagamento</h3></figcaption>
                <img src="./img/pay.png" alt="" class="footerImg">
            </figure>
        </div>
        <div class="copyrow">
            <hr>
                <p>1IKE AJIVS. Todos os direitos reservados &copy;2023</p>
            </div>
    </footer>
    <script src="./js/script.js"></script>
</body>
</html>
